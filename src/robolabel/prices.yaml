# robolabel price table (MEASUREMENT_SPEC 9.3). Read by robolabel.eval.prices.PriceTable.
#
# Units: USD per million tokens, everywhere in this file.
#
# Fields per model:
#   price_in, price_out   sync prompt and completion prices. Reasoning (thinking) tokens are billed
#                         as output tokens.
#   cached_in             the input_cache_read price, or null when none is listed (cached tokens are
#                         then billed at the input price). Cache writes are not modeled.
#   batch_in, batch_out   the model's ":batch" variant, only when it is cheaper than sync. null means
#                         there is no cheaper batch variant, so the batch-equivalent cost equals the
#                         sync cost and a real batch call is not priced (lookup raises).
#   effective_from        the first date the price was observed (not the vendor's launch date).
#   effective_to          the last day the price applies, or null when no end is announced.
#   source_url, accessed  where and when the price was read.
#
# Per-modality prices: none recorded. The 2026-09-27 catalogue read gave prompt, completion and
# input_cache_read prices only, so image, video and audio input tokens are priced at price_in
# (unverified per model).
#
# The OpenRouter prices were read from the live catalogue at 2026-09-27T08:26Z and equal the
# 2026-09-26 read in the tuneup config (models.yaml). Vendor prices are unverified beyond that read.
# Any change to this file changes the table version (version + first 12 hex chars of the file's
# SHA-256), which every receipt records.

version: "2026-09-27"
currency: USD
unit: usd_per_million_tokens

